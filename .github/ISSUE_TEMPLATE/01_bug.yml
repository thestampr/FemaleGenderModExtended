name: Bug Report
description: Report a reproducible problem with FemaleGenderModExtended.
labels: ["Bug"]
body:
  - type: input
    id: version
    attributes:
      label: "What Minecraft & mod version are you using?"
      placeholder: "Minecraft 1.21.11, FemaleGenderModExtended 0.1.0"
    validations:
      required: true

  - type: input
    id: fabric-version
    attributes:
      label: "What Fabric versions are you using?"
      description: Include both Fabric Loader and Fabric API versions.
      placeholder: "Fabric Loader 0.x.y, Fabric API 0.x.y"

  - type: textarea
    id: expected
    attributes:
      label: "What were you doing, and what did you expect to happen?"
      placeholder: |
        I was doing X, and expected Y to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "What actually happened?"
      description: |
        Do not paste long logs directly. Upload them to [mclo.gs](https://mclo.gs/) or a GitHub Gist and include the link.
      placeholder: |
        The game crashed
    validations:
      required: true

  - type: textarea
    id: repo-steps
    attributes:
      label: "Steps to reproduce this issue"
      description: |
        Please provide the list of steps required to reproduce this issue in as much detail as possible.
      placeholder: |
        1.
        2.
        3.
        ...
    validations:
      required: true

  - type: dropdown
    id: mod-compat
    attributes:
      label: "Is this a mod compatibility issue?"
      options:
        - "Not sure or not applicable"
        - "Yes, this issue only occurs with other mods present"
        - "No, this issue occurs with only this mod present"
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: "What other mods do you have?"
      description: |
        Please list any other mods involved if this issue relates to mod compatibility.

  - type: checkboxes
    id: checked-existing-issues
    attributes:
      label: "Existing issues"
      description: Search existing issues before submitting a new report.
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
